[Login]
# Lid close on battery -> suspend, then hibernate after HibernateDelaySec
HandleLidSwitch=suspend-then-hibernate
# On AC power -> ignore lid (useful when using external monitor)
HandleLidSwitchExternalPower=ignore
# Docked -> ignore lid
HandleLidSwitchDocked=ignore
# Force logind to handle lid events even when desktop environment holds inhibitor lock
LidSwitchIgnoreInhibited=yes
# Wait 3s after lid close before acting (prevents accidental triggers)
HoldoffTimeoutSec=3s
# Power button -> suspend-then-hibernate; long press -> poweroff
HandlePowerKey=suspend-then-hibernate
HandlePowerKeyLongPress=poweroff
