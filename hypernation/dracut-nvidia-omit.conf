# Omit NVIDIA drivers from early initramfs.
# On hybrid GPU systems (Intel UHD + NVIDIA Quadro), early KMS loading of NVIDIA
# breaks hibernation resume: nv_pmops_freeze returns -5 (EIO) because userspace
# video memory preservation is not accessible in initramfs.
# Intel i915 drives early display; NVIDIA drivers load cleanly via udev in userspace.
omit_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "
