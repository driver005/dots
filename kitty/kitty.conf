linux_display_server wayland
wayland_titlebar_color background
hide_window_decorations yes

# Auto-start tmux: attach to the 'main' session or create it
# shell tmux new-session -A -s main

font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.0
background_opacity 1.0

# notifications
enable_audio_bell no
notify_on_cmd_finish invisible 20

# window settings
window_padding_width 0
confirm_os_window_close 0

# scrollback
scrollback_lines 10000
scrollback_pager_history_size 10

# Remote control (needed by nav kittens / session tooling; local socket)
allow_remote_control yes
listen_on unix:/tmp/kitty

# Session restore (resurrect): load layout saved by ctrl+space>s
startup_session session.conf

# Window layouts (splits = tmux-like panes; stack = zoom)
enabled_layouts splits,stack

# Tab bar (separator style + powerline template)
include conf/tabs.conf

# Keybindings — LazyVim-style leader (ctrl+space)
include conf/keybindings.conf

# Colors: Catppuccin Mocha (palette + tab-bar colors) + auto light/dark
include conf/theme.conf
