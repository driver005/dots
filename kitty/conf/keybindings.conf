# vim:ft=kitty
# LazyVim-style leader map. Leader = ctrl+space (nvim leader is <space>; no clash).
# Mirrors ~/.config/nvim which-key. Terminal-only groups launch real CLIs.

# {{{ Keybindings
# top-level (LazyVim parity)
map ctrl+space>?           kitten scripts/which_key.py
map ctrl+space>shift+slash kitten scripts/which_key.py
map ctrl+space>shift+s     kitten scripts/session_menu.py

# scrollback search + mark nav (leftover kittens, now wired)
map ctrl+space>/ launch --location=hsplit --allow-remote-control kitty +kitten /home/default/.config/kitty/scripts/search.py @active-kitty-window-id
map ctrl+space>n kitten scripts/scroll_mark.py next
map ctrl+space>shift+n kitten scripts/scroll_mark.py prev
map ctrl+space>space    launch --type=overlay --cwd=current /home/default/.config/kitty/scripts/fzf-edit.sh
map ctrl+space>minus    launch --location=hsplit --cwd=current
map ctrl+space>shift+backslash launch --location=vsplit --cwd=current

# b = windows / splits
map ctrl+space>b>w next_window
map ctrl+space>b>d close_window
map ctrl+space>b>minus launch --location=hsplit --cwd=current
map ctrl+space>b>shift+backslash launch --location=vsplit --cwd=current
map ctrl+space>b>m toggle_layout stack
map ctrl+space>b>equal reset_window_sizes
map ctrl+space>b>h neighboring_window left
map ctrl+space>b>j neighboring_window bottom
map ctrl+space>b>k neighboring_window top
map ctrl+space>b>l neighboring_window right
# shift+hjkl = reorder (move/swap pane in that direction)
map ctrl+space>b>shift+h move_window left
map ctrl+space>b>shift+j move_window bottom
map ctrl+space>b>shift+k move_window top
map ctrl+space>b>shift+l move_window right

# w = buffers (kitty tabs)
map ctrl+space>w>b goto_tab 0
map ctrl+space>w>d close_tab
map ctrl+space>w>o close_other_tabs_in_os_window
map ctrl+space>w>n new_tab_with_cwd
map ctrl+space>w>l next_tab
map ctrl+space>w>h previous_tab
map ctrl+space>w>bracketright next_tab
map ctrl+space>w>bracketleft  previous_tab
# shift+h/l = reorder (move tab position)
map ctrl+space>w>shift+h move_tab_backward
map ctrl+space>w>shift+l move_tab_forward

# <tab> = tabs -> kitty OS windows (nvim tabpage analog)
map ctrl+space>tab>tab new_os_window
map ctrl+space>tab>d   close_os_window

# u = ui
map ctrl+space>u>t simulate_color_scheme_preference_change toggle
map ctrl+space>u>b simulate_color_scheme_preference_change toggle
map ctrl+space>u>shift+c launch --type=overlay --title themes kitty +kitten themes

# q = quit / session
map ctrl+space>q>q kitten scripts/save_and_close.py
map ctrl+space>q>d close_os_window
map ctrl+space>q>s kitten scripts/save_session.py

# --- CLI-launch groups (run real terminal tools) ---
# --hold: window stays (shows exit status) instead of vanishing when the
# program exits/crashes. Skipped on fzf/themes pickers — those are meant
# to close themselves when done.
# g = git
map ctrl+space>g>g launch --type=overlay --cwd=current --hold lazygit
# f = find (files)
map ctrl+space>f>f launch --type=overlay --cwd=current /home/default/.config/kitty/scripts/fzf-edit.sh
# s = search (grep)
map ctrl+space>s>g launch --type=overlay --cwd=current /home/default/.config/kitty/scripts/fzf-grep.sh
# a = AI
map ctrl+space>a>l launch --type=tab --hold claude
# m = xmake
map ctrl+space>m>b launch --type=tab --cwd=current --hold xmake build
map ctrl+space>m>r launch --type=tab --cwd=current --hold xmake run
map ctrl+space>m>c launch --type=tab --cwd=current --hold xmake clean
map ctrl+space>m>d launch --type=tab --cwd=current --hold xmake debug

# Fast pane nav (no leader) — nvim <-> kitty seamless via smart-splits kitten:
# if the focused window runs tmux/nvim it forwards the key, else moves.
map alt+h kitten neighboring_window.py left  alt+h
map alt+j kitten neighboring_window.py bottom alt+j
map alt+k kitten neighboring_window.py top    alt+k
map alt+l kitten neighboring_window.py right  alt+l

# ctrl+space>h/l — move through tabs. Short form of ctrl+space>w>h/l
# (tabs > splits — see notes).
map ctrl+space>h previous_tab
map ctrl+space>l next_tab

# Font zoom
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
# }}
