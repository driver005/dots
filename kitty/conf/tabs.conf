# vim:ft=kitty
# Tab bar — separator style, monoira/kitty-tabs powerline template.

# tab settings
tab_bar_edge top
tab_bar_min_tabs 1
# tab look from monoira/kitty-tabs (powerline round separators baked in template)
tab_bar_style separator
tab_separator ""
tab_title_template "{fmt.fg._5c6370}{fmt.bg._1e1e2e}{fmt.fg._cdd6f4}{fmt.bg._5c6370} ({index}) {title} {fmt.fg._5c6370}{fmt.bg._1e1e2e} "
active_tab_title_template "{fmt.fg._BAA0E8}{fmt.bg._1e1e2e}{fmt.fg._1e1e2e}{fmt.bg._BAA0E8} ({index}) {title} {fmt.fg._BAA0E8}{fmt.bg._1e1e2e} "
active_tab_font_style bold
tab_bar_margin_width 4.0
# two values: outer (above bar) inner (below bar)
tab_bar_margin_height 4.0 4.0
