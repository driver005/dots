# Tor variant - new windows/panes launch proxychains-wrapped shells so their
# network traffic routes through Tor. Needs proxychains + Tor running.
# Launch with: tmux -f ~/.config/tmux/tor.conf
source-file ~/.config/tmux/tmux.conf

bind -n M-s new-window   -c "#{pane_current_path}" -n "tor" "proxychains -q bash"
bind -n M-v split-window -c "#{pane_current_path}" -h "proxychains -q bash"
bind -n M-d split-window -c "#{pane_current_path}" -v "proxychains -q bash"

set -g status-right "#[fg=#BF616A,bg=default]󰒍 #[fg=#88C0D0,bg=default]󰒄 #[fg=#A3BE8C,bg=default]󰛵  "
