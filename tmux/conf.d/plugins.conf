# -- tpm plugins ---------------------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-fpp'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'graemedavidson/tmux-pane-focus'
set -g @plugin 'Peter-McKinney/tmux-fzf-open-files-nvim'
set -g @plugin 'trevarj/tmux-open-nvim'
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @plugin 'niqodea/tmux-matryoshka'
set -g @plugin 'bjesus/muxile'
set -g @plugin 'akohlbecker/aw-watcher-tmux'
set -g @plugin 'thepante/tmux-git-autofetch'
set -g @plugin 'lljbash/tmux-update-display'
set -g @plugin 'laktak/tome'
set -g @plugin '2kabhishek/tmux-tilit'

# -- plugin options ------------------------------------------------------------
set -g @tmux-which-key-disable-autobuild 1
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

set -g @extrakto_key 'none'

# tmux-fzf: config is via env vars, not @options - @tmux-fzf-launch-options
# was never a real option and was silently ignored.
set-environment -g TMUX_FZF_OPTIONS '-p -w 70% -h 70% -m'
setenv -g TMUX_FZF_LAUNCH_KEY 'F6'

set -g @fuzzback-table 'unused'
set -g @fuzzback-bind 'x'
set -g @fzf-url-bind 'F7'

# copycat/sessionist/tome/urlview/fpp/open-file-nvim: dropped their
# 'C-F12-x' overrides here - that's not valid tmux key-notation (a keysym
# can't be suffixed with another key), so those lines never bound anything.
# Reachable via each plugin's own defaults (copycat: S-F1..S-F5, C-d/f/g/u
# in the prefix table; sessionist: F10 goto, F12 new, S-F6/7/8/9
# promote/join/kill) and the which-key +Plugins/+Sessions menus.

set -g @sessionx-bind 'F2'
set -g @sessionx-prefix 'off'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-height '90%'
set -g @sessionx-window-width '75%'

set -g @thumbs-fg-color '#89b4fa'
set -g @thumbs-bg-color '#1e1e2e'
set -g @thumbs-hint-fg-color '#a6e3a1'
set -g @thumbs-hint-bg-color '#1e1e2e'

set -g @power_zoom_trigger 'F5'
set -g @power_zoom_without_prefix '1'

# floax: plain 'F8'/'F9' only binds in the prefix table - the '-n' is
# required (per the plugin's own bind-key construction) for a true
# root-level, no-prefix binding.
set -g @floax-bind '-n F8'
set -g @floax-bind-menu '-n F9'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'

set -g @logging_key 'S-F10'
set -g @screen-capture-key 'S-F11'
set -g @save-complete-history-key 'S-F12'
set -g @clear-history-key 'C-F12'

set -g @pane-focus-enabled 'on'
set -g @pane-focus-size '50'
set -g @pane-focus-direction '+'

set -g @matryoshka_down_keybind 'M-d'
set -g @matryoshka_up_keybind 'M-u'
set -g @matryoshka_up_recursive_keybind 'M-U'

set -g @git-autofetch-frequency '3'

# tmux-tilit: auto-tiling + Alt-hjkl focus / Alt-arrows resize. Its own
# navigator is left off - it would duplicate vim-tmux-navigator's C-hjkl,
# which is already wired to the real nvim config.
set -g @tilit-config "$HOME/.config/tmux/tmux.conf"
set -g @tilit-autotiling 'on'
set -g @tilit-navigator 'off'

# NOTE: no manual `run '.../tpm/tpm'` bootstrap here - Oh my tmux!'s own
# base config already auto-installs/updates/sources every @plugin above on
# every launch and reload (its _apply_configuration function, embedded as
# a self-piped comment block and invoked via the `run 'cut -c3- ... | sh
# -s _apply_configuration'` line in oh-my-tmux/.tmux.conf). Adding another
# bootstrap line here would just source tpm/tpm a second time per reload.
