# -- root keybindings for plugins ---------------------------------------------
# smart-splits.nvim's A-h/j/k/l (nvim<->tmux pane nav, wired in
# ~/.config/nvim/lua/plugins/smart-splits.lua - it calls tmux select-pane
# directly at the nvim edge, so no tmux-side is_vim binds are needed) and
# tmux-pain-control's prefix+h/j/k/l / prefix+H/J/K/L (vim-style
# select/resize) need no manual lines here - pain-control self-installs via
# Oh my tmux!'s auto-load of every @plugin in plugins.conf.
#
# (Replaced christoomey/vim-tmux-navigator, removed 2026-08-13: its presence
# caused a cursor-jump-on-scroll redraw glitch inside tmux.)
#
# Alt+arrows / Alt+h/j/k/l (pane focus + resize, no prefix) are NOT bound
# here either - tmux-tilit owns that modifier space now (@tilit-navigator
# off, everything else on), replacing the old manual M-Left/Right/Up/Down
# select-pane binds that used to live here.

# Shift+arrows to switch windows (no prefix)
bind -n S-Left previous-window #!important
bind -n S-Right next-window #!important

# Thumbs accessible from the C-Space menu.
# jump/power-zoom/suspend are NOT re-bound here - jump's own tmux-jump.tmux
# wrapper (called via F4) sets required env vars the raw .rb script needs;
# power-zoom and suspend already register F5/F12 correctly themselves via
# their @power_zoom_* options and default key, so a manual override here
# would only re-break them (as the old F5/F12 lines did).
bind -n F3 run-shell -b "$HOME/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.sh" #!important
bind -n F4 run-shell -b "$HOME/.config/tmux/plugins/tmux-jump/scripts/tmux-jump.sh" #!important
