# -- prefix --------------------------------------------------------------------
# No prefix in this setup. Move tmux prefix to an unused key and unbind the
# defaults so C-Space can be the tmux-which-key root menu only.
set -g prefix C-F12 #!important
set -gu prefix2 #!important
unbind C-F12 #!important
unbind C-b #!important
unbind C-a #!important

# -- shell ---------------------------------------------------------------------
# Default to bash; change to /bin/nu if you install nushell
set-option -g default-shell /bin/bash

# -- terminal / undercurl ------------------------------------------------------
# From 1amSimp1e/dots. Truecolor + undercurl support (styled + coloured
# underlines, e.g. red squiggles under nvim diagnostics). Needs tmux >= 3.0
# and a terminal that supports it.
# default-terminal must be tmux's own type, NOT the outer terminal ($TERM =
# xterm-kitty). Impersonating the host terminal makes tmux emit host-specific
# escapes that get double-processed -> cursor jumps / redraw glitches. tmux
# reaches kitty's real capabilities via terminal-overrides + terminal-features.
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Synchronized updates (DECSET 2026): makes tmux wrap full-screen redraws in
# begin/end-sync so the terminal renders atomically. Without it, per-scroll
# diffs show intermediate state - cursor visibly jumping around then settling,
# and transient frames making popup/menu text look like it's blinking.
# NOTE: terminal-features are read at CLIENT ATTACH time - a config change only
# takes effect for NEWLY attached clients; existing windows need a reattach.
set -g terminal-features ',*256col*:RGB,xterm-kitty:Sync,ghostty:Sync,wezterm:Sync,alacritty:Sync'

# -- session/display -------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g mouse on
