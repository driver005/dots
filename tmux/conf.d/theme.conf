# Status bar from 1amSimp1e/dots, Nord palette, his original bg=black.
# "black" = palette color0; with his kitty config color0 is #151720 (near
# the #14151e background), so the bar reads dark and matches the app.
# catppuccin/tmux removed (it was overriding status-style).
set-environment -g tmux_conf_theme disabled

set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-interval 15

# Message style.
set -g message-style "fg=#EBCB8B,bg=black"
set -g message-command-style "fg=#EBCB8B,bg=black"

# Pane style.
set -g pane-border-style "fg=#3B4252"
set -g pane-active-border-style "fg=#3B4252"

# Status style.
set -g status-style "fg=#BBC3D4,bg=black"
set -g status-left "#[fg=#8FBCBB,bg=black]#[fg=black,bg=#8FBCBB,bold] #{session_windows}#[fg=#8FBCBB,bg=black]  "
set -g status-right "#[fg=#3B4252,bg=black]󰎚 #(~/.config/tmux/scripts/tdo-pending.sh)  #[fg=#3B4252,bg=black] #S #[fg=#A3BE8C,bg=black] #[fg=black,bg=#A3BE8C,bold]󱫋 #{session_attached}#[fg=#A3BE8C,bg=black]"

# Window style.
set -g window-status-style "fg=#434C5E,bg=black"
set -g window-status-format "#[fg=default,bg=black] #[fg=default,bg=black]#W"
set -g window-status-separator "  "
set -g window-status-current-format "#[fg=cyan,bg=black] #[fg=cyan,bg=black]#W"
